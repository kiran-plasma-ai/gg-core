[project]
name = "gg-core"
version = "0.2.0"
description = "GitGantt core - session management via tmux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "libtmux>=0.50.0",
]

[project.scripts]
gg = "gg_core.cli.run:run"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gg_core"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pytest-cov>=7.0.0",
]

# =============================================================================
# Tool Configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
# libtmux's bundled plugin applies pytest marks to fixtures, which pytest
# 9.2 rejects at load. We never use it: tests mock libtmux entirely.
addopts = "-p no:libtmux"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "N818"]  # Line too long, exception naming

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
namespace_packages = true
explicit_package_bases = true
