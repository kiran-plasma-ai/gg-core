[project]
name = "gg-core"
version = "0.1.0"
description = "GitGantt core - session management via tmux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "libtmux>=0.50.0",
]

[project.scripts]
gg-core = "gitgantt.cli.run:run"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitgantt", "src/gitgantt/core", "src/gitgantt/cli"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pytest-cov>=7.0.0",
]
